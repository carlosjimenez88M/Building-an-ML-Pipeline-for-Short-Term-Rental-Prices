main:
  components_repository: "https://github.com/udacity/nd0821-c2-build-model-workflow-starter.git#components"
  project_name: nyc_airbnb
  experiment_name: development
  steps: all

etl:
  sample: "sample1.csv"
  train_data_artifact: "nyc_airbnb/trainval_data.csv:latest"
  min_price: 10  
  max_price: 350  

data_check:
  kl_threshold: 0.2

modeling:
  test_size: 0.2  
  val_size: 0.2
  random_seed: 42
  stratify_by: "neighbourhood_group"
  max_tfidf_features: 15
  random_forest:
    n_estimators: 500
    max_depth: 50
    min_samples_split: 2
    min_samples_leaf: 3
    n_jobs: -1
    criterion: absolute_error
    max_features: 0.5
    oob_score: true
  output_artifact: "trained_random_forest_regression"
# {"model__max_depth": 50, "model__max_features": 0.5, "model__min_samples_leaf": 3, "model__min_samples_split": 2, "model__n_estimators": 500}